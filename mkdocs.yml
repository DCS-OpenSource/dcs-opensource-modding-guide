site_name: DCS Modding Documentation

theme:
    name: material
    language: en
    palette:
        scheme: slate

plugins:
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: tr
          name: Türkçe
          build: true
          site_name: DCS Modlama Dokümantasyonu
          theme:
            language: tr
          nav:
            - Ana Sayfa: index.md
            - Faydalı Bağlantılar: links.md

            - Aircraft Lua:
              - Temel İlkeler: Aircraft/Lua/BasicPrinciples.md

              - Stub'lar:
                - Device Stub'ları: Aircraft/Lua/Stubs/DeviceStubs.md
                - Mainpanel Stub'ları: Aircraft/Lua/Stubs/MainPanelStubs.md
                - LockOn_Options: Aircraft/Lua/Stubs/LockOnOptions.md

              - Modüller:
                - Terrain: Aircraft/Lua/Modules/Terrain.md

              - Cihazlar:
                - avLuaDevice: Aircraft/Lua/Devices/avLuaDevice.md
                - avSimpleWeaponSystem: Aircraft/Lua/Devices/avSimpleWeaponSystem.md
                - avSimpleRadar: Aircraft/Lua/Devices/avSimpleRadar.md

              - Göstergeler:
                - Çizim: Aircraft/Lua/Indicators/drawing.md
                - Kontrolcüler: Aircraft/Lua/Indicators/controllers.md

              - Eklentiler:
                - NavDataPlugin: Aircraft/Lua/Plugins/NavDataPlugin.md
                - WeaponSystemPlugin: Aircraft/Lua/Plugins/WeaponSystemPlugin.md
                - LuaToolsPlugin: Aircraft/Lua/Plugins/LuaToolsPlugin.md

            - Aircraft EFM:
              - EFM API: Aircraft/EFM/EFM_API.md
              - Faydalı Notlar:
                - Prop Blur: Aircraft/EFM/Useful_bits/prop_blur.md

            - Veritabanı:
              - wsTypes: Database/wsTypes.md
              - iCommands: Database/iCommands.md
              - Draw Args: Database/draw-args.md

            - Faydalı Notlar:
              - Modelviewer: UsefulBits/ModelViewer.md
              - Kokpit Sesleri: UsefulBits/CockpitSounds.md

            - ED Blender Exporter:
              - Genel Bakış: EDM-Export/Overview.md
              - Mesh: EDM-Export/Mesh.md
              - Materyaller: EDM-Export/Materials.md
              - Animasyonlar: EDM-Export/Animations.md
              - Işıklar: EDM-Export/Lights.md
              - Bilinen Hatalar: EDM-Export/errors.md

            - Katkıda Bulunma: contributing.md
  - search:
      lang:
        - en
        - tr

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - attr_list
  - pymdownx.blocks.caption
  - toc:
        permalink: "#"

extra_css:
  - css/extra.css

nav:
  - Home: index.md
  - Useful Links: links.md
  
  - Aircraft Lua:
    - Basic Principles: Aircraft/Lua/BasicPrinciples.md

    - Stubs:
      - Device Stubs: Aircraft/Lua/Stubs/DeviceStubs.md
      - Mainpanel Stubs: Aircraft/Lua/Stubs/MainPanelStubs.md
      - LockOn_Options: Aircraft/Lua/Stubs/LockOnOptions.md

    - Modules:
      - Terrain: Aircraft/Lua/Modules/Terrain.md

    - Devices:
      - avLuaDevice: Aircraft/Lua/Devices/avLuaDevice.md
      - avSimpleWeaponSystem: Aircraft/Lua/Devices/avSimpleWeaponSystem.md
      - avSimpleRadar: Aircraft/Lua/Devices/avSimpleRadar.md

    - Indicators:
      - Drawing: Aircraft/Lua/Indicators/drawing.md
      - Controllers: Aircraft/Lua/Indicators/controllers.md

    - Plugins:
      - NavDataPlugin: Aircraft/Lua/Plugins/NavDataPlugin.md
      - WeaponSystemPlugin: Aircraft/Lua/Plugins/WeaponSystemPlugin.md
      - LuaToolsPlugin: Aircraft/Lua/Plugins/LuaToolsPlugin.md

  - Aircraft EFM:
    - EFM API: Aircraft/EFM/EFM_API.md
    - Useful Bits: 
      - Prop Blur: Aircraft/EFM/Useful_bits/prop_blur.md

  - Database:
    - wsTypes: Database/wsTypes.md
    - iCommands: Database/iCommands.md
    - Draw Args: Database/draw-args.md

  - Useful bits:
    - Modelviewer: UsefulBits/ModelViewer.md
    - Cockpit Sounds: UsefulBits/CockpitSounds.md

  - ED Blender Exporter:
      - Overview: EDM-Export/Overview.md
      - Mesh: EDM-Export/Mesh.md
      - Materials: EDM-Export/Materials.md
      - Animations: EDM-Export/Animations.md
      - Lights: EDM-Export/Lights.md
      - Known Errors: EDM-Export/errors.md

  - Contributing: contributing.md
